name: Package ATOM Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true

permissions:
  contents: write

jobs:
  package-release:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-latest

    steps:
    - name: Check out the release
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}

    - name: Build release archive
      shell: pwsh
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        $stage = Join-Path $env:RUNNER_TEMP 'ATOM-release'
        $archive = Join-Path $env:RUNNER_TEMP 'ATOM.zip'
        git archive HEAD -o (Join-Path $env:RUNNER_TEMP 'source.zip')
        Expand-Archive (Join-Path $env:RUNNER_TEMP 'source.zip') $stage

        @('.github', '.gitignore', 'LICENSE', 'README.md') | ForEach-Object {
            $path = Join-Path $stage $_
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
        }

        . (Join-Path $stage 'ATOM\Functions\Get-AtomFileHash.ps1')
        . (Join-Path $stage 'ATOM\Functions\New-AtomFileManifest.ps1')
        . (Join-Path $stage 'ATOM\Functions\Write-AtomUpdateState.ps1')
        $files = New-AtomFileManifest -RootPath $stage
        Write-AtomUpdateState -Path (Join-Path $stage 'ATOM\Config\UpdateState.json') -Channel main -CommitSha (git rev-parse HEAD).Trim() -Files $files
        Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive

        $channel = [ordered]@{
            SchemaVersion = 1
            Channel = 'main'
            CommitSha = (git rev-parse HEAD).Trim()
            PackageUri = "https://github.com/SkylerWallace/ATOM/releases/download/$env:RELEASE_TAG/ATOM.zip"
            PackageSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash
        }
        $channel | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'ATOM-channel.json') -Encoding utf8

    - name: Upload ATOM.zip
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        gh release upload $env:RELEASE_TAG (Join-Path $env:RUNNER_TEMP 'ATOM.zip') --clobber
        gh release upload $env:RELEASE_TAG (Join-Path $env:RUNNER_TEMP 'ATOM-channel.json') --clobber
