name: Package ATOM Development Snapshot

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-development:
    runs-on: windows-latest

    steps:
    - name: Check out the development branch
      uses: actions/checkout@v4

    - name: Build development archive
      shell: pwsh
      run: |
        $stage = Join-Path $env:RUNNER_TEMP 'ATOM-development'
        $archive = Join-Path $env:RUNNER_TEMP 'ATOM-dev.zip'
        git archive HEAD -o (Join-Path $env:RUNNER_TEMP 'source.zip')
        Expand-Archive (Join-Path $env:RUNNER_TEMP 'source.zip') $stage

        @('.github', '.gitignore', 'LICENSE', 'README.md') | ForEach-Object {
            $path = Join-Path $stage $_
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
        }

        $ownedFiles = @(Get-ChildItem -LiteralPath $stage -File -Recurse -Force | ForEach-Object {
            $_.FullName.Substring($stage.Length).TrimStart('\').Replace('\', '/')
        })
        $state = [ordered]@{
            SchemaVersion = 1
            Channel = 'dev'
            CommitSha = (git rev-parse HEAD).Trim()
            OwnedFiles = $ownedFiles
        }
        $state | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $stage 'ATOM\Config\UpdateState.json') -Encoding utf8
        Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive

    - name: Publish rolling development asset
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view dev-snapshot *> $null
        if ($LASTEXITCODE -ne 0) {
            gh release create dev-snapshot --prerelease --target $env:GITHUB_SHA --title 'ATOM Development Snapshot' --notes 'Automatically updated from the dev branch.'
        }
        gh release upload dev-snapshot (Join-Path $env:RUNNER_TEMP 'ATOM-dev.zip') --clobber
